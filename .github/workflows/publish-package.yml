name: Publish package

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # setup-node writes an .npmrc that reads ${NODE_AUTH_TOKEN}, and yarn stops
    # when the variable is not set. setup-node v4 exported this placeholder and
    # v7 does not. The GitHub Packages step sets the real token.
    env:
      NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@the-curve-consulting"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build package
        run: yarn build

      - name: Choose the dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          # npm does not infer this: without --tag it moves `latest` to whatever
          # it just published, so a prerelease would become the default install
          # for anyone running `npm install` without a version.
          if [[ "$version" == *-* ]]; then
            echo "$version is a prerelease - publishing under 'next'"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "$version is a stable release - publishing under 'latest'"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to GitHub Packages
        run: npm publish --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          HUSKY: 0
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          scope: "@the-curve-consulting"

      - name: Publish package to npmjs
        run: |
          npm publish --registry https://registry.npmjs.org --access public --provenance \
            --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          HUSKY: 0
